<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Letterhead React Example</title>
    <!-- built by `npm run build:example` -->
    <link rel="stylesheet" href="dist/main.css" />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        line-height: 1.5;
      }
      h1 {
        color: #1e88e5;
      }
      table.items {
        width: 100%;
        border-collapse: collapse;
      }
      table.items th,
      table.items td {
        border: 1px solid #ccc;
        padding: 4px 8px;
      }
      table.items thead th {
        background: #e3f2fd;
      }
      .total {
        text-align: right;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="dist/main.js"></script>
  </body>
</html>
